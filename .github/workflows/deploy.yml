name: Deploy to Fly.io

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "vendor/**"
      - ".gitignore"
      - ".dockerignore"
      - "LICENSE"
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx eslint src
      - run: npx tsc -p . --noEmit
      # Generator equivalence (spec-0042): committed schema artifacts must
      # match a fresh regeneration from src/contracts.ts.
      - run: npm run schemas:check
      # Cross-repo contract drift: the cli repo vendors a copy of the wire
      # schema; it must be byte-identical to ours. The cli repo is public and
      # this repo is private, so the check lives here. 404 = not yet vendored
      # (bootstrap) — skip; any other non-200 fails loud.
      - name: Check wire schema matches edge-book-cli
        run: |
          code=$(curl -sS -o /tmp/cli-wire-frames.schema.json -w "%{http_code}" \
            https://raw.githubusercontent.com/antonyevans/edge-book-cli/main/schemas/wire-frames.schema.json)
          if [ "$code" = "404" ]; then
            echo "cli copy not yet vendored — skipping (bootstrap)"
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "fetch failed: HTTP $code"
            exit 1
          fi
          diff -u schemas/wire-frames.schema.json /tmp/cli-wire-frames.schema.json
      - run: npm test

  deploy:
    name: Deploy to Fly.io
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
