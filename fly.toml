# fly.toml app configuration file generated for edge-book-host on 2026-06-01T13:28:04-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'edge-book-host'
primary_region = 'sjc'

[build]

[env]
  DATA_DIR = '/data'
  NODE_ENV = 'production'
  PORT = '8080'

[[mounts]]
  source = 'edge_book_host_data'
  destination = '/data'

# Single service block. auto_stop_machines MUST stay 'off' — the host serves
# long-lived agent dial-out websockets; stopping the machine drops every
# paired agent. Do NOT let `flyctl launch` rewrite this back to a
# [http_service] shorthand.
[[services]]
  protocol = 'tcp'
  internal_port = 8080
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 200
    soft_limit = 150

  [[services.tcp_checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'

  # HTTP healthcheck on /healthz (ea-claude-084). A tcp_check passes whenever the
  # port is open — even if the app has wedged. This actually exercises the app so
  # fly restarts a wedged-but-listening machine automatically, which is the real
  # resilience win for a stateful single-machine host (a volume-bound mailbox
  # singleton can't safely run 2 machines — that needs externalized state).
  [[services.http_checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '20s'
    method = 'get'
    path = '/healthz'
    protocol = 'http'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
